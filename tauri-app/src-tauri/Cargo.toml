[package]
name = "respisound"
version = "1.0.0"
description = "RespiSound — Respiratory Disease Screening"
authors = []
license = ""
repository = ""
default-run = "respisound"
edition = "2021"
rust-version = "1.70"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "1.7", features = [
    "shell-open",
    "window-close",
    "window-minimize",
    "window-maximize",
    "window-unminimize",
    "window-unmaximize",
    "window-start-dragging",
] }
ureq = "2.9"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
